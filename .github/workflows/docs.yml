name: Publish documentation

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'docs/**'
      - 'examples/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '*.md'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'docs/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUSTDOCFLAGS: -D warnings

jobs:
  build:
    name: Build API and student documentation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      - name: Build public API documentation
        run: cargo doc --locked --no-deps
      - name: Assemble the student landing page
        shell: bash
        run: |
          mkdir -p _site
          cp -R target/doc/. _site/
          cp docs/index.html _site/index.html
          version=$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[0].version')
          sed -i "s/@PACKAGE_VERSION@/$version/g; s/@BUILD_REVISION@/$GITHUB_SHA/g" _site/index.html
          test -f _site/openbo/index.html
          test -f _site/openbo/core/index.html
          test -f _site/openbo/optimizers/index.html
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    name: Deploy GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish the reviewed documentation artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
