[package]
name = "openbo-rust"
version = "0.1.1"
edition = "2024"
rust-version = "1.85"
description = "Native Rust research and teaching library for Bayesian optimization"
license = "MIT"
repository = "https://github.com/M-Colley/openbo-rust"
homepage = "https://m-colley.github.io/openbo-rust/"
documentation = "https://m-colley.github.io/openbo-rust/openbo/"
keywords = ["bayesian", "optimization", "gaussian-process", "machine-learning", "research"]
categories = ["algorithms", "science"]
readme = "README.md"
include = [
    "/Cargo.toml", "/Cargo.lock", "/src/**", "/tests/**", "/examples/**",
    "/tools/*.py", "/tools/*.ps1", "/docs/**",
    "/LICENSE", "/README.md", "/PORTING.md", "/VALIDATION.md", "/CHANGELOG.md",
    "/CITATION.cff", "/UPSTREAM_CITATION.cff", "/relevant_papers/references.bib",
]

[package.metadata.docs.rs]
default-target = "x86_64-unknown-linux-gnu"
targets = []

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
nalgebra = { version = "0.33", features = ["serde-serialize"] }
rand = "0.8"
rand_chacha = { version = "0.3", features = ["serde1"] }
rand_distr = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
serde_yaml = "0.9"
statrs = "0.18"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time"] }
tokio-tungstenite = "0.26"

[dev-dependencies]
tempfile = "3"

[lib]
name = "openbo"
path = "src/lib.rs"

[[bin]]
name = "openbo"
path = "src/main.rs"
